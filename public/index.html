<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPO Filled Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">IPO Filled Tracker <span>sHNI / bHNI · Individual accounts</span></div>
    <nav id="tabs">
      <button data-tab="apply" class="active">Apply</button>
      <button data-tab="report">Reports</button>
      <button data-tab="ipos">IPOs</button>
      <button data-tab="accounts">Accounts</button>
    </nav>
  </header>

  <main>
    <!-- APPLY -->
    <section id="tab-apply" class="tab active">
      <div class="apply-layout">
        <aside>
          <div class="aside-head">
            <h3>IPOs</h3>
            <select id="ipoFilter">
              <option value="active">Open &amp; upcoming</option>
              <option value="all">All</option>
            </select>
          </div>
          <div id="ipoList" class="ipo-list"></div>
        </aside>
        <div id="applyPanel" class="panel">
          <p class="muted">Select an IPO on the left.</p>
        </div>
      </div>
    </section>

    <!-- REPORT -->
    <section id="tab-report" class="tab">
      <div class="panel">
        <div class="filters">
          <label>From <input type="date" id="rFrom"></label>
          <label>To <input type="date" id="rTo"></label>
          <label>IPO
            <select id="rIpo"><option value="">All IPOs</option></select>
          </label>
          <label>Category
            <select id="rCat"><option value="">sHNI + bHNI</option><option value="SHNI">sHNI only</option><option value="BHNI">bHNI only</option></select>
          </label>
          <div class="quick">
            <button class="ghost" data-range="month">This month</button>
            <button class="ghost" data-range="last30">Last 30 days</button>
            <button class="ghost" data-range="clear">Clear</button>
          </div>
          <div class="spacer"></div>
          <button id="dlXlsx" class="primary">Download Excel</button>
          <button id="dlPdf" class="primary alt">Download PDF</button>
        </div>
        <div id="reportOut"></div>
      </div>
    </section>

    <!-- IPOS -->
    <section id="tab-ipos" class="tab">
      <div class="panel">
        <div class="row-between">
          <div>
            <h3>IPOs</h3>
            <p class="muted" id="syncInfo"></p>
          </div>
          <div class="btns">
            <button id="syncBtn" class="ghost">Sync from NSE now</button>
            <button id="addIpoBtn" class="primary">+ Add IPO manually</button>
          </div>
        </div>
        <form id="ipoForm" class="card form hidden">
          <input type="hidden" name="id">
          <label>Company name <input name="name" required></label>
          <label>Symbol <input name="symbol"></label>
          <label>Type <select name="type"><option>Mainboard</option><option>SME</option></select></label>
          <label>Open date <input type="date" name="openDate"></label>
          <label>Close date <input type="date" name="closeDate"></label>
          <label>Price band low <input type="number" step="0.01" name="priceLow"></label>
          <label>Price band high (upper) <input type="number" step="0.01" name="priceHigh" required></label>
          <label>Lot size (shares) <input type="number" name="lotSize" required></label>
          <div class="btns full">
            <button type="submit" class="primary">Save</button>
            <button type="button" class="ghost" id="ipoCancel">Cancel</button>
          </div>
        </form>
        <div class="table-wrap"><table id="ipoTable"></table></div>
      </div>
    </section>

    <!-- ACCOUNTS -->
    <section id="tab-accounts" class="tab">
      <div class="panel">
        <div class="row-between">
          <div><h3>Accounts</h3><p class="muted">Rename accounts and add PAN. Changes save automatically.</p></div>
          <button id="addAccBtn" class="primary">+ Add account</button>
        </div>
        <div class="table-wrap"><table id="accTable"></table></div>
      </div>
    </section>
  </main>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
