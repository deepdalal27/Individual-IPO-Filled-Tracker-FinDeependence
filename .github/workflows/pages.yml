name: Update IPOs and publish site

on:
  push:
    branches: [claude/wizardly-darwin-whybnz]
  schedule:
    - cron: '7,37 * * * *'   # twice an hour (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Build allotment auto-fill script
        run: npm run build:helper
      - name: Fetch latest IPOs from NSE
        run: npm run sync
      - name: Save updated IPO list
        run: |
          if ! git diff --quiet -- site/ipos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/ipos.json
            git commit -m "Update IPO list from NSE"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
